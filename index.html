<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Guia Capixaba</title>
  <meta name="description" content="Praias, pontos turísticos e restaurantes da Grande Vitória e região — dicas de quem roda o ES todo dia.">
  <meta name="theme-color" content="#f3f7f8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%236b3e26'/><rect x='3' y='3' width='26' height='26' rx='3' fill='none' stroke='white' stroke-width='2'/><path d='M8 22l6-10 3 5 2-3 5 8z' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <button class="voltar" id="voltar" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"/></svg>
    </button>
    <a href="#/" class="marca" aria-label="Guia Capixaba, início">
      <span class="marca-placa">Guia Capixaba</span>
    </a>
  </header>

  <main id="app" tabindex="-1"></main>

  <section class="apoio" aria-label="Avaliação e contribuição">
    <p class="apoio-linha">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z" fill="currentColor"/></svg>
      <span><strong>Curtiu a corrida?</strong> Avalie com 5 estrelas no app da Uber.</span>
    </p>
    <p class="apoio-linha">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 20.5S3 15 3 8.8A4.8 4.8 0 0 1 12 6.3a4.8 4.8 0 0 1 9 2.5C21 15 12 20.5 12 20.5z" fill="currentColor"/></svg>
      <span><strong>Gostou do guia?</strong> Contribua com qualquer valor. A chave Pix está no cartão aqui no carro.</span>
    </p>
  </section>

  <footer class="rodape">
    <a class="patrocinio" id="patrocinio" target="_blank" rel="noopener">
      <span class="patrocinio-label">Oferecimento</span>
      <img src="img/logo-gold-vibes.svg" alt="Gold Vibes" class="patrocinio-logo">
    </a>
    <p class="creditos">Fotos: <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a></p>
  </footer>

  <div class="anuncio" id="anuncio" role="dialog" aria-modal="true" aria-labelledby="anuncio-titulo" hidden>
    <div class="anuncio-caixa">
      <button class="anuncio-fechar" id="anuncio-fechar" aria-label="Fechar anúncio">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2"/></svg>
      </button>
      <span class="anuncio-tag">Patrocinado</span>
      <img class="anuncio-logo" src="img/logo-gold-vibes.svg" alt="">
      <h2 id="anuncio-titulo">Gold Vibes</h2>
      <p id="anuncio-texto"></p>
      <a class="anuncio-botao" id="anuncio-botao" target="_blank" rel="noopener">Conhecer a loja</a>
      <button class="anuncio-depois" id="anuncio-depois">Agora não</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
